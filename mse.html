<!doctype html>
<!--
  mse.html: Mental Status Exam: builds the form from mse-data.js and turns selections into a note.
  Shared: workbench-shared.css (design), workbench-theme.js (theme).
  Appearance: mse.css.
  Shared assessment actions: workbench-ui.js (except the home page).
  Behavior (loaded at the bottom): mse-data.js, mse.js, embed-resize.js.
  id attributes connect controls to JavaScript; class attributes connect them to CSS.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mental Status Exam | Clinical Workbench</title>

    <!-- Fonts used on the Squarespace site -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Asap:wght@400;500;600;700&family=Cutive&display=swap"
      rel="stylesheet"
    />

    <!-- Page layout first; the shared design system owns common styling. -->
    <link rel="stylesheet" href="mse.css?v=20261003-review6" />
    <link rel="stylesheet" href="workbench-shared.css?v=20261003-review6" />
    <script src="workbench-theme.js?v=20261003-audit4"></script>
  </head>

  <body>
    <main class="page-shell">
      <div class="mse-topbar">
        <a class="back-link" href="index.html">← Back to Clinical Workbench</a>
        <button type="button" id="theme-toggle" class="secondary-button" aria-pressed="false">
          <span class="theme-icon" aria-hidden="true">☀︎</span
          ><span class="theme-label">Light mode</span>
        </button>
      </div>

      <h1>Mental Status Exam</h1>

      <section class="card controls-card">
        <div>
          <h2>Mode</h2>
          <label class="inline-option">
            <input type="radio" name="mode" value="learn" checked />
            Learn
          </label>
          <label class="inline-option">
            <input type="radio" name="mode" value="compact" />
            Compact
          </label>
        </div>

        <div class="button-row">
          <button data-reset-assessment="true" type="button" onclick="resetToNormal()">
            <span class="reset-icon" aria-hidden="true">↺</span> Reset assessment
          </button>
          <button
            id="toggle-all-info"
            type="button"
            class="secondary-button learning-only"
            aria-expanded="false"
            onclick="toggleAllInfo()"
          >
            Open all info
          </button>
        </div>
      </section>

      <!-- mse.js builds these fields from the section definitions in mse-data.js. -->
      <div id="mse-fields"></div>

      <!-- Generated note and output controls. JavaScript writes the result into the output field. -->
      <section class="card output-card">
        <h2>Generated Documentation</h2>

        <div class="output-style-row">
          <span class="small-label">Output style</span>

          <label class="inline-option compact-inline">
            <input type="radio" name="outputStyle" value="narrative" checked />
            Narrative
          </label>

          <label class="inline-option compact-inline">
            <input type="radio" name="outputStyle" value="list" />
            List
          </label>
          <div class="output-copy-actions">
            <button data-copy-output type="button">Copy</button>
            <span id="copyStatus" aria-live="polite" data-copy-status></span>
          </div>
        </div>

        <textarea
          id="output"
          data-note-output
          aria-label="Generated documentation"
          readonly
        ></textarea>
      </section>
    </main>

    <!-- Clinical content loads first; mse.js uses that content to build the page. -->
    <!-- Scripts run after the markup exists. Keep this load order, especially mse-data.js before mse.js. -->
    <script src="workbench-ui.js?v=20261003-clearable2"></script>
    <script src="mse-data.js?v=20261003-review6"></script>
    <script src="mse.js?v=20261003-review6"></script>
    <script src="embed-resize.js?v=20261003-audit4"></script>
  </body>
</html>
