<!doctype html>
<!--
  brief-assessment.html: Shared engine for MDQ, ACEs, PCEs, ASRS, WHO-5, PC-PTSD-5, and CRAFFT; the URL chooses the measure.
  Shared: workbench-shared.css (design), workbench-theme.js (theme).
  Appearance: screening.css, brief-assessment.css.
  Shared assessment actions: workbench-ui.js (except the home page).
  Behavior (loaded at the bottom): brief-assessment.js, embed-resize.js.
  id attributes connect controls to JavaScript; class attributes connect them to CSS.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assessment | Clinical Workbench</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Asap:wght@400;500;600;700&family=Cutive&display=swap"
      rel="stylesheet"
    />
    <!-- Page layout first; the shared design system owns common styling. -->
    <link rel="stylesheet" href="screening.css?v=20261003-review6" />
    <link rel="stylesheet" href="brief-assessment.css?v=20261003-review6" />
    <link rel="stylesheet" href="workbench-shared.css?v=20261003-review6" />
    <script src="workbench-theme.js?v=20261003-audit4"></script>
  </head>
  <body data-clearable-answers class="spacious-tool">
    <main class="page-shell">
      <a class="back-link" href="index.html">← Back to Clinical Workbench</a>
      <h1 id="page-title">Assessment</h1>

      <section class="card intro-card">
        <h2 id="full-title"></h2>
        <p id="instructions"></p>
        <p id="age-note" class="helper-text"></p>
        <div class="button-row">
          <button data-reset-assessment="true" type="button" id="reset-button">
            <span class="reset-icon" aria-hidden="true">↺</span> Reset assessment
          </button>
        </div>
      </section>

      <!-- JavaScript inserts the selected measure’s question controls into this empty container. -->
      <div id="questions"></div>

      <!-- Results display: JavaScript updates scores and interpretation after answers change. -->
      <section class="card results-card">
        <div class="results-summary">
          <div>
            <span class="small-label">Score</span>
            <div id="score-display" class="score-display"></div>
          </div>
          <div>
            <span class="small-label">Result</span>
            <div id="result-display" class="severity-display"></div>
          </div>
        </div>
        <div id="result-note" class="information-alert"></div>
      </section>

      <!-- Generated note and output controls. JavaScript writes the result into the output field. -->
      <section class="card output-card">
        <h2>Generated Documentation</h2>
        <div class="output-style-row">
          <span class="small-label">Output style</span>
          <label class="inline-option"
            ><input type="radio" name="outputStyle" value="summary" checked /> Narrative</label
          >
          <label class="inline-option"
            ><input type="radio" name="outputStyle" value="detailed" /> List</label
          >
          <div class="output-copy-actions">
            <button data-copy-output type="button" id="copy-button">Copy</button>

            <span id="copy-status" aria-live="polite" data-copy-status></span>
          </div>
        </div>
        <textarea
          id="output"
          data-note-output
          aria-label="Generated documentation"
          readonly
        ></textarea>
      </section>

      <!-- Reference information and interpretation guidance. -->
      <section class="card reference-card">
        <h2>Clinical Note</h2>
        <p id="clinical-note"></p>
        <p id="attribution" class="helper-text"></p>
      </section>
    </main>
    <!-- Scripts run after the markup exists. Keep the page script before the shared embedding helper. -->
    <script src="workbench-ui.js?v=20261003-clearable2"></script>
    <script src="brief-assessment.js?v=20261003-clearable"></script>
    <script src="embed-resize.js?v=20261003-audit4"></script>
  </body>
</html>
